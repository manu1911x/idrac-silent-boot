general:
  poll_interval_seconds: 5
  bmc_boot_wait_timeout_seconds: 300
  bmc_probe_interval_seconds: 3

dell_r730xd:
  enabled: true
  initial_fan_speed_percent: 5
  power_on_delay_seconds: 2
  watchdog:
    max_consecutive_failures: 4
    emergency_temp_celsius: 78
    emergency_recovery_celsius: 65
  fan_curve:
    - min_temp: 75
      action: "manual"
      fan_speed_percent: 50
    - min_temp: 65
      action: "manual"
      fan_speed_percent: 25
    - min_temp: 55
      action: "manual"
      fan_speed_percent: 12
    - min_temp: 45
      action: "manual"
      fan_speed_percent: 7
    - min_temp: 0
      action: "manual"
      fan_speed_percent: 4

mcafee_rmm3:
  enabled: true
  auto_power_on: true

kiosk:
  initial_delay_seconds: 5
  check_interval_seconds: 3
